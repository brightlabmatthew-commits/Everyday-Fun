<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hygiene Detectives Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --ink:#1E2A38;
    --bg:#EAF4F4;
    --navy:#2C4A6E;
    --gold:#D9A62E;
    --card:#FFFFFF;
    --green:#4CAF50;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Verdana','Trebuchet MS',sans-serif;
    background-color:var(--bg);
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }
  .bubble-layer{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-60px; border-radius:50%;
    border:2px solid rgba(44,74,110,.25);
    background:rgba(255,255,255,.35);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.6; }
    100%{ transform:translateY(-110vh) translateX(20px); opacity:0; }
  }
  .deck{position:relative; width:100vw; height:100vh; z-index:1;}
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:5vh 8vw;
    text-align:center;
    opacity:0;
    transform:scale(.92);
    transition:opacity .45s ease, transform .45s ease;
  }
  .slide.active{
    display:flex;
    opacity:1;
    transform:scale(1);
  }
  .eyebrow{
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--navy);
    font-size:.85rem;
    margin-bottom:.75rem;
    font-weight:700;
  }
  h1{font-size:2.8rem; margin-bottom:1rem;}
  h2{font-size:2.2rem; margin-bottom:1rem;}
  p.sub{font-size:1.2rem; opacity:.85; max-width:700px; line-height:1.5;}
  .badge-frame{ position:relative; display:flex; flex-direction:column; align-items:center; }
  .badge-ring{
    width:170px; height:170px; border-radius:50%;
    border:6px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:1.2rem;
    background:var(--card);
    box-shadow:0 8px 0 rgba(0,0,0,.12);
    position:relative;
  }
  .badge-ring .logo{ width:110px; height:110px; border-radius:50%; margin:0; }
  .magnifier{
    position:absolute; bottom:-10px; right:-10px;
    font-size:2.6rem;
    animation:swingglass 3s ease-in-out infinite;
    transform-origin:70% 30%;
  }
  @keyframes swingglass{ 0%,100%{ transform:rotate(-10deg);} 50%{ transform:rotate(10deg);} }
  ul.list{ text-align:left; font-size:1.2rem; line-height:2; list-style:none; }
  ul.list li:before{ content:"🔍  "; }
  .qcard{ max-width:800px; width:100%; }
  .qnum{ color:var(--navy); font-weight:700; margin-bottom:.5rem; }
  .qtitle{ font-size:1.5rem; margin-bottom:1rem; font-weight:700; }
  .mystery{
    width:200px; height:200px; margin:0 auto 1.4rem;
    background:var(--card); border-radius:20px;
    border:3px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 0 rgba(0,0,0,.08);
    overflow:hidden; position:relative;
  }
  .mystery img{ width:100%; height:100%; object-fit:cover; display:block; }
  .mystery .img-fallback{
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:.3rem; width:100%; height:100%; color:var(--ink); opacity:.55; text-align:center;
    font-size:2rem; padding:.4rem;
  }
  .mystery .img-fallback small{ font-size:.65rem; font-family:monospace; opacity:.9; }
  .item-name{ font-size:1.6rem; font-weight:800; color:var(--navy); margin-bottom:1rem; }
  .questions{ text-align:left; max-width:560px; margin:0 auto; font-size:1.05rem; line-height:1.6; }
  .qline{ margin-bottom:.6rem; }
  .qline b{ color:var(--navy); }
  .answer{
    display:none; opacity:0; transform:translateY(6px);
    transition:opacity .4s ease, transform .4s ease;
  }
  .answer.show{ display:block; opacity:1; transform:translateY(0); }
  .reveal-btn{
    margin-top:1.2rem;
    background:var(--navy); color:#fff; border:none;
    border-radius:999px; padding:.8rem 1.8rem; font-size:1.05rem; font-weight:700;
    cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .reveal-btn:disabled{ opacity:.4; cursor:default; }
  .thanks-emoji{ font-size:5rem; margin-bottom:1rem; }
  nav{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:1.2rem 2rem; z-index:10;
  }
  nav button{
    background:var(--gold); color:var(--ink);
    border:none; border-radius:999px;
    padding:.7rem 1.6rem; font-size:1rem; font-weight:700;
    cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  nav button:disabled{ opacity:.3; cursor:default; }
  .progress{ font-size:.9rem; opacity:.6; }
  .burst{ position:absolute; font-size:1.4rem; pointer-events:none; animation:burstfly .8s ease-out forwards; z-index:20; }
  @keyframes burstfly{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--bx), var(--by)) scale(.4); opacity:0; }
  }
  /* ---- Annotation toolbar (pen / text / eraser / shapes) ---- */
  .annot-layer{
    position:fixed; inset:0; z-index:8; pointer-events:none;
  }
  .annot-layer.tool-active{ pointer-events:auto; cursor:crosshair; }
  .annot-layer[data-tool="text"]{ cursor:text; }
  .annot-layer[data-tool="eraser"]{ cursor:cell; }
  .annot-svg{ width:100%; height:100%; display:block; }
  .annot-el{ pointer-events:auto; }
  .annot-text-label{
    position:absolute; min-width:24px; max-width:60vw;
    padding:4px 8px; background:rgba(255,255,255,.92);
    border:1.5px solid; border-radius:6px;
    font-family:Verdana,sans-serif; font-size:16px; line-height:1.3;
    color:#111; cursor:pointer; pointer-events:auto;
    word-wrap:break-word; white-space:pre-wrap;
  }
  .annot-text-popup{
    position:fixed; z-index:20; display:none; flex-direction:column; gap:.5rem;
    width:220px; background:#fff; border:1px solid rgba(0,0,0,.15);
    border-radius:10px; padding:.6rem; box-shadow:0 8px 24px rgba(0,0,0,.28);
  }
  .annot-text-popup.open{ display:flex; }
  .annot-text-popup textarea{
    width:100%; min-height:64px; resize:vertical;
    font-family:Verdana,sans-serif; font-size:.95rem;
    border:1px solid rgba(0,0,0,.18); border-radius:6px; padding:.4rem;
    outline:none;
  }
  .annot-text-popup-actions{ display:flex; justify-content:flex-end; gap:.4rem; }
  .annot-text-popup-actions button{
    padding:.35rem .7rem; border-radius:6px; border:1px solid rgba(0,0,0,.15);
    background:#f5f5f5; cursor:pointer; font-size:.85rem;
  }
  .annot-text-popup-actions button.primary{ background:#333; color:#fff; border-color:#333; }
  .annot-text-popup-actions button.danger{ color:#B5432E; border-color:#B5432E; margin-right:auto; }
  .annot-toolbar{
    position:fixed; top:50%; right:10px; transform:translateY(-50%);
    z-index:15; display:flex; flex-direction:column; gap:.4rem;
    background:rgba(255,255,255,.92); border:1px solid rgba(0,0,0,.12);
    border-radius:12px; padding:.5rem; box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .annot-toolbar .toggle-handle{
    background:#333; color:#fff; font-weight:700;
  }
  .annot-toolbar .toggle-handle:hover{ background:#555; }
  .annot-toolbar-body{ display:flex; flex-direction:column; gap:.4rem; }
  .annot-toolbar.collapsed .annot-toolbar-body{ display:none; }
  .annot-toolbar button{
    width:34px; height:34px; border-radius:8px; border:1px solid transparent;
    background:#fff; cursor:pointer; font-size:1rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    color:#333;
  }
  .annot-toolbar button:hover{ background:#f0f0f0; }
  .annot-toolbar button.active{ background:#333; color:#fff; border-color:#333; }
  .annot-toolbar .annot-sep{ height:1px; background:rgba(0,0,0,.12); margin:.15rem 0; }
  .annot-toolbar .annot-colors{ display:flex; flex-direction:column; gap:.3rem; }
  .annot-toolbar .swatch{
    width:34px; height:16px; border-radius:6px; cursor:pointer; border:2px solid transparent;
    padding:0;
  }
  .annot-toolbar .swatch.active{ border-color:#333; }
</style>
</head>
<body>
<div class="bubble-layer" id="bubbleLayer"></div>
<div class="deck" id="deck"></div>
<div class="annot-layer" id="annotLayer" data-tool="select">
  <svg class="annot-svg" id="annotSvg"></svg>
</div>
<div class="annot-toolbar" id="annotToolbar">
  <button class="toggle-handle" id="annotToggleHandle" title="Show/hide annotate tools">🖊️</button>
  <div class="annot-toolbar-body" id="annotToolbarBody">
    <button data-tool="select" class="active" title="Pointer (default)">🖐️</button>
    <button data-tool="pen" title="Pen">✏️</button>
    <button data-tool="text" title="Text box">🔤</button>
    <button data-tool="rect" title="Rectangle">▭</button>
    <button data-tool="oval" title="Oval">⬭</button>
    <button data-tool="arrow" title="Arrow">↗️</button>
    <button data-tool="line" title="Line">／</button>
    <button data-tool="eraser" title="Eraser">🧹</button>
    <div class="annot-sep"></div>
    <div class="annot-colors" id="annotColors">
      <button class="swatch active" data-color="#E63946" style="background:#E63946" title="Red"></button>
      <button class="swatch" data-color="#2B5FDB" style="background:#2B5FDB" title="Blue"></button>
      <button class="swatch" data-color="#3F9142" style="background:#3F9142" title="Green"></button>
      <button class="swatch" data-color="#F2B705" style="background:#F2B705" title="Yellow"></button>
    </div>
    <div class="annot-sep"></div>
    <button id="annotClearBtn" title="Clear this slide">🗑️</button>
  </div>
</div>
<div class="annot-text-popup" id="annotTextPopup">
  <textarea id="annotTextInput" placeholder="Type your note..."></textarea>
  <div class="annot-text-popup-actions">
    <button id="annotTextDelete" class="danger" style="display:none;">Delete</button>
    <button id="annotTextCancel">Cancel</button>
    <button id="annotTextAdd" class="primary">Add</button>
  </div>
</div>
<nav>
  <button id="prevBtn">&larr; Prev</button>
  <span class="progress" id="progress"></span>
  <button id="nextBtn">Next &rarr;</button>
</nav>

// ---- Annotation toolbar engine ----
(function(){
  const layer = document.getElementById('annotLayer');
  const svg = document.getElementById('annotSvg');
  const toolbar = document.getElementById('annotToolbar');
  const clearBtn = document.getElementById('annotClearBtn');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const textPopup = document.getElementById('annotTextPopup');
  const textInput = document.getElementById('annotTextInput');
  const textAddBtn = document.getElementById('annotTextAdd');
  const textCancelBtn = document.getElementById('annotTextCancel');
  const textDeleteBtn = document.getElementById('annotTextDelete');

  // Declared as a hoisted function so it's safely callable from
  // clearBtn's listener below AND from each deck's show(i) function.
  function clearAnnotations(){
    svg.querySelectorAll('.annot-el').forEach(el=>el.remove());
    layer.querySelectorAll('.annot-text-label').forEach(el=>el.remove());
    closeTextPopup();
  }
  window.clearAnnotations = clearAnnotations;

  let currentTool = 'select';
  let currentColor = '#E63946';
  let drawing = false;
  let currentPath = null;
  let pathPoints = [];
  let shapeStart = null;
  let currentShapeEl = null;

  function setTool(tool){
    currentTool = tool;
    layer.dataset.tool = tool;
    layer.classList.toggle('tool-active', tool !== 'select');
    toolbar.querySelectorAll('button[data-tool]').forEach(b=>{
      b.classList.toggle('active', b.dataset.tool === tool);
    });
  }
  toolbar.querySelectorAll('button[data-tool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tool = btn.dataset.tool;
      // Clicking the already-active tool toggles back to the pointer
      setTool(tool === currentTool && tool !== 'select' ? 'select' : tool);
    });
  });

  // Toggle handle: show/hide the tool body; always drops back to
  // Pointer/Select when hiding so the overlay never stays stuck
  // capturing clicks with no visible way to turn it off.
  const toggleHandle = document.getElementById('annotToggleHandle');
  toggleHandle.addEventListener('click', ()=>{
    const collapsing = !toolbar.classList.contains('collapsed');
    toolbar.classList.toggle('collapsed', collapsing);
    if(collapsing) setTool('select');
  });
  toolbar.querySelectorAll('.swatch').forEach(sw=>{
    sw.addEventListener('click', ()=>{
      currentColor = sw.dataset.color;
      toolbar.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      sw.classList.add('active');
    });
  });

  function svgPoint(evt){
    const rect = svg.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  let editingLabel = null;
  let pendingPos = null;

  function openTextPopup(clientX, clientY, placementPoint, existingLabel){
    editingLabel = existingLabel || null;
    pendingPos = existingLabel ? null : placementPoint;
    textInput.value = existingLabel ? existingLabel.textContent : '';
    textDeleteBtn.style.display = existingLabel ? 'inline-block' : 'none';

    // Position near the click, clamped so it stays fully on-screen.
    const popupW = 232, popupH = 150;
    let left = clientX, top = clientY;
    if(left + popupW > window.innerWidth) left = window.innerWidth - popupW - 10;
    if(top + popupH > window.innerHeight) top = window.innerHeight - popupH - 10;
    left = Math.max(10, left);
    top = Math.max(10, top);
    textPopup.style.left = left + 'px';
    textPopup.style.top = top + 'px';

    textPopup.classList.add('open');
    textInput.focus();
    textInput.select();
  }

  function closeTextPopup(){
    textPopup.classList.remove('open');
    editingLabel = null;
    pendingPos = null;
    textInput.value = '';
  }

  textAddBtn.addEventListener('click', ()=>{
    const val = textInput.value.trim();
    if(!val){ closeTextPopup(); return; }
    if(editingLabel){
      editingLabel.textContent = val;
    } else if(pendingPos){
      const label = document.createElement('div');
      label.className = 'annot-text-label annot-el';
      label.textContent = val;
      label.style.left = pendingPos.x + 'px';
      label.style.top = pendingPos.y + 'px';
      label.style.color = currentColor;
      label.style.borderColor = currentColor;
      layer.appendChild(label);
    }
    closeTextPopup();
  });
  textCancelBtn.addEventListener('click', closeTextPopup);
  textDeleteBtn.addEventListener('click', ()=>{
    if(editingLabel) editingLabel.remove();
    closeTextPopup();
  });
  textInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      textAddBtn.click();
    } else if(e.key === 'Escape'){
      e.preventDefault();
      closeTextPopup();
    }
  });

  function startShape(tag, attrs){
    const el = document.createElementNS(SVG_NS, tag);
    Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));
    el.classList.add('annot-el');
    svg.appendChild(el);
    return el;
  }

  layer.addEventListener('pointerdown', (e)=>{
    if(currentTool === 'select') return;

    if(currentTool === 'text'){
      const p = svgPoint(e);
      const existingLabel = e.target.closest('.annot-text-label');
      openTextPopup(e.clientX, e.clientY, p, existingLabel || null);
      return;
    }
    const p = svgPoint(e);

    if(currentTool === 'pen'){
      drawing = true;
      pathPoints = [p];
      currentPath = startShape('path', {
        d: `M${p.x},${p.y}`, stroke: currentColor, 'stroke-width': 4,
        fill: 'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'
      });
    } else if(['rect','oval','line','arrow'].includes(currentTool)){
      drawing = true;
      shapeStart = p;
      if(currentTool === 'rect'){
        currentShapeEl = startShape('rect', {
          x:p.x, y:p.y, width:0, height:0, fill:'none',
          stroke: currentColor, 'stroke-width':3
        });
      } else if(currentTool === 'oval'){
        currentShapeEl = startShape('ellipse', {
          cx:p.x, cy:p.y, rx:0, ry:0, fill:'none',
          stroke: currentColor, 'stroke-width':3
        });
      } else if(currentTool === 'line' || currentTool === 'arrow'){
        const lineAttrs = {
          x1:p.x, y1:p.y, x2:p.x, y2:p.y,
          stroke: currentColor, 'stroke-width':3
        };
        if(currentTool === 'arrow') lineAttrs['marker-end'] = 'url(#annotArrowHead)';
        currentShapeEl = startShape('line', lineAttrs);
      }
    } else if(currentTool === 'eraser'){
      const target = e.target.closest('.annot-el');
      if(target) target.remove();
    }
  });

  layer.addEventListener('pointermove', (e)=>{
    if(!drawing) {
      if(currentTool === 'eraser' && e.buttons === 1){
        const target = e.target.closest('.annot-el');
        if(target) target.remove();
      }
      return;
    }
    const p = svgPoint(e);
    if(currentTool === 'pen' && currentPath){
      pathPoints.push(p);
      const d = pathPoints.map((pt,i)=> (i===0?'M':'L') + pt.x + ',' + pt.y).join(' ');
      currentPath.setAttribute('d', d);
    } else if(currentTool === 'rect' && currentShapeEl){
      const x = Math.min(shapeStart.x, p.x), y = Math.min(shapeStart.y, p.y);
      const w = Math.abs(p.x - shapeStart.x), h = Math.abs(p.y - shapeStart.y);
      currentShapeEl.setAttribute('x', x); currentShapeEl.setAttribute('y', y);
      currentShapeEl.setAttribute('width', w); currentShapeEl.setAttribute('height', h);
    } else if(currentTool === 'oval' && currentShapeEl){
      const cx = (shapeStart.x + p.x)/2, cy = (shapeStart.y + p.y)/2;
      const rx = Math.abs(p.x - shapeStart.x)/2, ry = Math.abs(p.y - shapeStart.y)/2;
      currentShapeEl.setAttribute('cx', cx); currentShapeEl.setAttribute('cy', cy);
      currentShapeEl.setAttribute('rx', rx); currentShapeEl.setAttribute('ry', ry);
    } else if((currentTool === 'line' || currentTool === 'arrow') && currentShapeEl){
      currentShapeEl.setAttribute('x2', p.x); currentShapeEl.setAttribute('y2', p.y);
    }
  });

  function endStroke(){
    drawing = false;
    currentPath = null;
    currentShapeEl = null;
    shapeStart = null;
  }
  layer.addEventListener('pointerup', endStroke);
  layer.addEventListener('pointerleave', endStroke);

  clearBtn.addEventListener('click', clearAnnotations);

  // Arrowhead marker def, added once
  const defs = document.createElementNS(SVG_NS, 'defs');
  defs.innerHTML = `
    <marker id="annotArrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"></path>
    </marker>
  `;
  svg.appendChild(defs);
})();

    bristles:[ "M40,35 L40,55","M50,30 L50,60","M60,28 L60,62","M70,30 L70,60","M80,35 L80,55" ] },

  ]}
};

function buildIconSVG(key, size){
  const icon = ICONS[key];
  let inner = '';
  (icon.paths||[]).forEach(d=>{ inner += `<path class="draw-path" d="${d}"></path>`; });
  (icon.bristles||[]).forEach(d=>{ inner += `<path class="draw-path" d="${d}"></path>`; });
  (icon.ellipses||[]).forEach(e=>{ inner += `<ellipse class="draw-path" cx="${e.cx}" cy="${e.cy}" rx="${e.rx}" ry="${e.ry}"></ellipse>`; });
  return `<svg class="draw-icon" viewBox="0 0 120 120" width="${size}" height="${size}">${inner}</svg>`;
}
function prepDraw(container){
  container.querySelectorAll('.draw-path').forEach(p=>{
    const len = p.getTotalLength ? p.getTotalLength() : 100;
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });
}
function playDraw(container){
  const paths = container.querySelectorAll('.draw-path');
  paths.forEach((p, i)=>{
    setTimeout(()=>{
      p.style.transition = 'stroke-dashoffset 1s ease';
      p.style.strokeDashoffset = 0;
    }, i*160);
  });
}
function animateAllIconsIn(slideEl){
  const icons = slideEl.querySelectorAll('.draw-icon');
  icons.forEach(svg=>prepDraw(svg));
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      icons.forEach(svg=>playDraw(svg));
    });
  });
}

function burstAt(x,y){
  const emojis = ["🔍","✨","🧼"];
  for(let i=0;i<8;i++){
    const b = document.createElement('div');
    b.className = 'burst';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random()*2*Math.PI;
    const dist = 60 + Math.random()*60;
    b.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
    b.style.setProperty('--by', Math.sin(angle)*dist + 'px');
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 850);
  }
}

let current = 0;
function show(i){
  clearAnnotations();
  slides.forEach(s=>s.classList.remove('active'));
  current = Math.max(0, Math.min(i, slides.length-1));
  const activeSlide = slides[current];
  activeSlide.classList.add('active');
  animateAllIconsIn(activeSlide);
  document.getElementById('progress').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length-1;
}
document.getElementById('prevBtn').onclick = ()=>show(current-1);
document.getElementById('nextBtn').onclick = ()=>show(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') show(current+1);
  if(e.key === 'ArrowLeft') show(current-1);
});
show(0);
</script>
