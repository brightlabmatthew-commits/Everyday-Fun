<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Would You Choose...?</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --ink:#3A2E2A;
    --bg:#FFF8F0;
    --coral:#FF6B6B;
    --yellow:#FFD93D;
    --teal:#4ECDC4;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Verdana', 'Trebuchet MS', sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }
  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .confetti{
    position:absolute; top:-30px; width:12px; height:12px;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:.9; }
  }
  .blobs{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .blob{
    position:absolute; font-size:2.2rem; opacity:.4;
    animation:floaty ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0) rotate(-8deg); }
    50%{ transform:translateY(-30px) rotate(8deg); }
  }
  .deck{position:relative; width:100vw; height:100vh; z-index:1;}
  .slide{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 8vw;
    text-align:center;
    opacity:0;
    transform:translateY(30px);
    transition:opacity .5s cubic-bezier(.34,1.56,.64,1), transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .slide.active{
    display:flex;
    opacity:1;
    transform:translateY(0);
  }
  .eyebrow{
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--coral);
    font-size:.85rem;
    margin-bottom:.75rem;
    font-weight:700;
  }
  h1{font-size:3rem; margin-bottom:1rem; color:var(--ink);}
  h2{font-size:2.2rem; margin-bottom:1rem; color:var(--ink);}
  p.sub{font-size:1.25rem; opacity:.85; max-width:700px; line-height:1.5;}
  .logo{
    width:96px; height:96px; border-radius:50%;
    margin-bottom:1rem; box-shadow:0 6px 18px rgba(0,0,0,.2);
    animation:wiggle 3s ease-in-out infinite;
    background:#fff;
  }
  @keyframes wiggle{
    0%,100%{ transform:rotate(-4deg) scale(1); }
    50%{ transform:rotate(4deg) scale(1.05); }
  }
  .fork-frame{
    display:flex; align-items:center; justify-content:center; gap:1.6rem;
  }
  .signpost{
    width:86px; padding:.7rem .4rem; border-radius:8px;
    font-weight:800; font-size:1.05rem; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
    animation:swing ease-in-out infinite;
  }
  .signpost.left{ background:var(--teal); transform-origin:right center; animation-duration:2.6s; }
  .signpost.right{ background:var(--coral); transform-origin:left center; animation-duration:3s; }
  @keyframes swing{ 0%,100%{ transform:rotate(-5deg);} 50%{ transform:rotate(5deg);} }
  .fork-center{ display:flex; flex-direction:column; align-items:center; }
  ul.list{ text-align:left; font-size:1.2rem; line-height:2; list-style:none; }
  ul.list li:before{ content:"🤔  "; }
  .qcard{ max-width:900px; width:100%; }
  .qnum{ color:var(--coral); font-weight:700; margin-bottom:.5rem; }
  .qtext{ font-size:1.7rem; margin-bottom:2rem; line-height:1.4; }
  .choices{ display:grid; grid-template-columns:repeat(2,1fr); gap:1.5rem; width:100%; max-width:640px; margin:0 auto; }
  .choice{
    background:var(--card);
    border:4px solid var(--teal);
    border-radius:20px;
    padding:1.8rem 1.2rem;
    cursor:pointer;
    font-size:1.25rem;
    font-weight:700;
    color:var(--ink);
    transition:transform .15s ease, background .2s ease;
    box-shadow:0 4px 0 rgba(0,0,0,.1);
  }
  .choice:nth-child(2){ border-color:var(--coral); }
  .choice .emoji{ font-size:3rem; display:block; margin-bottom:.6rem; }
  .choice:hover{ transform:translateY(-4px) scale(1.03); }
  .choice.picked{ background:var(--yellow); animation:pop .4s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.1);} 100%{transform:scale(1.03);} }
  .followup{
    margin-top:1.8rem; font-size:1.2rem; min-height:2.5rem;
    color:var(--ink); font-weight:600; font-style:italic;
  }
  .thanks-emoji{ font-size:5rem; margin-bottom:1rem; animation:wiggle 2s ease-in-out infinite; }
  nav{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:1.2rem 2rem; z-index:10;
  }
  nav button{
    background:var(--coral); color:#fff;
    border:none; border-radius:999px;
    padding:.7rem 1.6rem; font-size:1rem; font-weight:700;
    cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.2);
  }
  nav button:disabled{ opacity:.3; cursor:default; }
  .progress{ font-size:.9rem; opacity:.6; }
  .burst{ position:absolute; font-size:1.4rem; pointer-events:none; animation:burstfly .8s ease-out forwards; }
  @keyframes burstfly{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--bx), var(--by)) scale(.4); opacity:0; }
  }
</style>
</head>
<body>
<div class="confetti-layer" id="confettiLayer"></div>
<div class="blobs" id="blobs"></div>
<div class="deck" id="deck"></div>
<nav>
  <button id="prevBtn">&larr; Prev</button>
  <span class="progress" id="progress"></span>
  <button id="nextBtn">Next &rarr;</button>
</nav>

// Falling confetti
const colors = ["#FF6B6B","#FFD93D","#4ECDC4","#FF9F1C","#7BDFF2"];
const confettiLayer = document.getElementById('confettiLayer');
for(let i=0;i<40;i++){
  const c = document.createElement('div');
  c.className = 'confetti';
  c.style.left = Math.random()*100 + 'vw';
  c.style.background = colors[Math.floor(Math.random()*colors.length)];
  c.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
  c.style.animationDuration = (5 + Math.random()*6) + 's';
  c.style.animationDelay = (Math.random()*8) + 's';
  confettiLayer.appendChild(c);
}
// Floating blobs
const blobEmojis = ["🎈","⭐","🌈","🎉","💛"];
const blobLayer = document.getElementById('blobs');
for(let i=0;i<7;i++){
  const b = document.createElement('div');
  b.className = 'blob';
  b.textContent = blobEmojis[Math.floor(Math.random()*blobEmojis.length)];
  b.style.left = Math.random()*95 + 'vw';
  b.style.top = Math.random()*90 + 'vh';
  b.style.animationDuration = (4 + Math.random()*4) + 's';
  b.style.animationDelay = (Math.random()*4) + 's';
  blobLayer.appendChild(b);
}

function burstAt(x,y){
  const emojis = ["🎉","✨","💫"];
  for(let i=0;i<8;i++){
    const b = document.createElement('div');
    b.className = 'burst';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const angle = Math.random()*2*Math.PI;
    const dist = 60 + Math.random()*60;
    b.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
    b.style.setProperty('--by', Math.sin(angle)*dist + 'px');
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 850);
  }
}

const deck = document.getElementById('deck');
let slides = [];
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

slides.push(el(`

    <div class="fork-frame">

      </div>

  </section>
`));

slides.push(el(`
  <section class="slide">
    <h2>Instructions</h2>
    <ul class="list">
      <li>We'll ask 8 "would you choose" questions.</li>
      <li>Pick the option you like best — there's no wrong answer!</li>

    </ul>
  </section>
`));

questions.forEach((item, i)=>{
  const s = el(`
    <section class="slide">
      <div class="qcard">
        <div class="qnum">Question ${i+1} of ${questions.length}</div>
        <div class="qtext">${item.q}</div>
        <div class="choices">
          <button class="choice" data-side="a"><span class="emoji">${item.a.e}</span>${item.a.t}</button>
          <button class="choice" data-side="b"><span class="emoji">${item.b.e}</span>${item.b.t}</button>
        </div>
        <div class="followup"></div>
      </div>
    </section>
  `);
  const buttons = s.querySelectorAll('.choice');
  const followup = s.querySelector('.followup');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.classList.remove('picked'));
      btn.classList.add('picked');
      followup.textContent = item.followup;
      const r = btn.getBoundingClientRect();
      burstAt(r.left + r.width/2, r.top + r.height/2);
    });
  });
  slides.push(s);
});

slides.push(el(`
  <section class="slide">
    <div class="thanks-emoji">🌟</div>
    <h2>Thanks for Sharing!</h2>
    <p class="sub">We loved hearing your choices and your reasons. See you next time!</p>
  </section>
`));

slides.forEach(s=>deck.appendChild(s));

let current = 0;
function show(i){
  slides.forEach(s=>s.classList.remove('active'));
  current = Math.max(0, Math.min(i, slides.length-1));
  slides[current].classList.add('active');
  document.getElementById('progress').textContent = (current+1) + ' / ' + slides.length;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === slides.length-1;
}
document.getElementById('prevBtn').onclick = ()=>show(current-1);
document.getElementById('nextBtn').onclick = ()=>show(current+1);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') show(current+1);
  if(e.key === 'ArrowLeft') show(current-1);
});
show(0);
</script>
</body>
</html>
